name: Triage

on:
  issues:
    types:
      - opened

permissions:
  issues: write

jobs:
  label:
    name: Label by extension
    runs-on: ubuntu-latest
    steps:
      - name: Apply extension label
        uses: actions/github-script@v7
        with:
          script: |
            // Issue bodies are untrusted input, so labels come only from this map.
            const allowlist = {
              'Address Completion': 'ext:address-completion',
              'Live Preview': 'ext:live-preview',
            };

            const body = context.payload.issue.body ?? '';
            const match = body.match(/###\s*Extension\s*\n+\s*(.+)/);
            const selection = match?.[1]?.trim();
            const label = allowlist[selection] ?? 'needs-triage';

            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                labels: [label],
              });
            } catch (error) {
              core.warning(`Could not apply label "${label}": ${error.message}`);
            }
